name: Validate RoastedKart

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, security/secure-order-admin]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run pricing tests
        run: npm test
      - name: Build production frontend
        run: npm run build
